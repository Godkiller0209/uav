<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>UAV Map</title>

    <!-- Thu vien CSS cua Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Thu vien JavaScript cua Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Thu vien cau noi Python - JavaScript -->
    <script src="qrc:///qtwebchannel/qwebchannel.js">
    </script>

    <style>

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            min-height: 0;
        }

        #toolbar {
            box-sizing: border-box;
            min-height: 54px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            font-family: sans-serif;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }

        #point-count {
            margin-left: auto;
            font-family: sans-serif;
        }

        #message {
            width: 100%;
            color: #333;
        }

    </style>

</head>

<body>

    <div id="toolbar">
        <button id="undo-point" type="button">Xóa điểm cuối</button>
        <button id="clear-area" type="button">Xóa toàn bộ</button>
        <button id="confirm-area" type="button">Xác nhận và lưu</button>
        <label for="spacing">Khoảng cách quét (m):</label>
        <input id="spacing" type="number" min="1" step="1" value="20">
        <button id="generate-path" type="button">Tạo đường quét</button>
        <span id="point-count">0 điểm</span>
        <span id="message" role="status"></span>
    </div>
    <div id="map"></div>

    <script src="map.js"></script>

</body>

</html>
