<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>UAV Map</title>

    <!-- Thu vien CSS cua Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Thu vien JavaScript cua Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Thu vien cau noi Python - JavaScript -->
    <script src="qrc:///qtwebchannel/qwebchannel.js">
    </script>

    <style>

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            min-height: 0;
        }

        #toolbar {
            box-sizing: border-box;
            min-height: 54px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            font-family: sans-serif;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }

        #area-count {
            margin-left: auto;
            font-family: sans-serif;
        }

        #message {
            width: 100%;
            color: #333;
        }

        #coordinate-list {
            box-sizing: border-box;
            width: 100%;
            max-height: 100px;
            margin: 0;
            overflow: auto;
            font-size: 11px;
        }

        .mode-active {
            background: #8bc34a;
            border-color: #558b2f;
            color: #102000;
        }

        .waypoint-icon {
            background: transparent;
            border: 0;
        }

        .waypoint-icon span {
            display: block;
            width: 24px;
            height: 24px;
            border: 2px solid white;
            border-radius: 50%;
            background: #6a1b9a;
            color: white;
            font: bold 12px/24px sans-serif;
            text-align: center;
            box-shadow: 0 1px 4px #333;
        }

        .waypoint-first span {
            background: #ef6c00;
        }

    </style>

</head>

<body>

    <div id="toolbar">
        <button id="new-area" type="button">Vẽ đa giác mới</button>
        <button id="undo-point" type="button">Xóa điểm cuối</button>
        <button id="finish-area" type="button">Hoàn thành và lưu</button>
        <button id="cancel-drawing" type="button">Hủy vẽ</button>
        <select id="area-list" aria-label="Chọn khu vực tìm kiếm">
            <option value="">Chưa có khu vực</option>
        </select>
        <input id="area-name" type="text" placeholder="Tên khu vực">
        <button id="rename-area" type="button">Đổi tên</button>
        <button id="delete-area" type="button">Xóa khu vực đã chọn</button>
        <button id="choose-uav-position" type="button">Chọn vị trí UAV</button>
        <label for="spacing">Khoảng cách quét (m):</label>
        <input id="spacing" type="number" min="1" step="1" value="20">
        <button id="generate-path" type="button">Tạo đường quét</button>
        <span id="area-count">0 khu vực</span>
        <span id="message" role="status"></span>
        <pre id="coordinate-list">Chọn một khu vực để xem tọa độ.</pre>
    </div>
    <div id="map"></div>

    <script src="map.js"></script>

</body>

</html>
